name: Acidic CO2 literature alerts

on:
  schedule:
    - cron: "17 09 * * *"
      timezone: "Asia/Tokyo"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: acidic-co2-literature-alert
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Search and notify
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LOOKBACK_DAYS: "14"
          FIRST_RUN_SEND_LIMIT: "8"
          MAX_ALERTS_PER_RUN: "20"
        run: python literature_bot.py

      - name: Persist deduplication state
        run: |
          if git diff --quiet -- state/seen.json; then
            echo "No new state to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/seen.json
          git commit -m "chore: update literature alert state"
          git push
